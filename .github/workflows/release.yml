name: Publish compatibility snapshot

on:
  push:
    tags:
      - "atmons-*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: compatibility-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate signed tag and exact snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#atmons-}"
          manifest="versions/${version}/manifest.json"
          test -f "${manifest}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          fingerprint="$(gpg --show-keys --with-colons \
            .github/release-signing-key.asc | \
            awk -F: '$1 == "fpr" { print $10; exit }')"
          test "${fingerprint}" = "693A28560FFDD859A77B513BB0DCE42D90C8150C"
          gpg --batch --import .github/release-signing-key.asc
          git verify-tag "${GITHUB_REF_NAME}"
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(jq -r '.atmons.version' "${manifest}")" = "${version}"
          test "$(jq -r '.atmons.tag' "${manifest}")" = "${GITHUB_REF_NAME}"
          python tools/validate.py --version "${version}" --remote
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Test installer
        run: |
          bash -n bin/bluemap-atmons install.sh tests/test-installer.sh
          bash tests/test-installer.sh
      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.snapshot.outputs.version }}"
          mkdir dist
          cp "versions/${version}/manifest.json" "dist/bluemap-atmons-${version}.json"
          (cd dist && sha256sum "bluemap-atmons-${version}.json" > SHA256SUMS)
      - name: Attest release metadata
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/bluemap-atmons-${{ steps.snapshot.outputs.version }}.json
            dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/bluemap-atmons-${{ steps.snapshot.outputs.version }}.json \
            dist/SHA256SUMS \
            --verify-tag \
            --title "BlueMap ATMons ${{ steps.snapshot.outputs.version }}" \
            --notes "Pinned BlueMap and add-on compatibility snapshot for All the Mons ${{ steps.snapshot.outputs.version }}. See the tagged README and integration record for exact scope and validation."
