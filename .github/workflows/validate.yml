name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate manifests and gitlinks
        run: python tools/validate.py
      - name: Test development tooling pin
        run: |
          python tests/test-tooling-manifest.py
          PYTHONPATH=toolkit/src python -m unittest discover -s toolkit/tests -p 'test_*.py'
          PYTHONPATH=toolkit/src python -m bluemap_addon_toolkit --version
      - name: Check shell syntax
        run: bash -n bin/bluemap-atmons install.sh tests/test-installer.sh
      - name: Test installer
        run: bash tests/test-installer.sh
      - name: Test integration tooling
        run: |
          python integration/test_build_candidate_addons.py
          python integration/galleries/test_compose.py
          python integration/test_child_gates.py
          python integration/test_runtime_suite.py
          python integration/test_structure_suite.py
      - name: Test deduplication scanner
        run: |
          python tests/test-duplicate-scanner.py
          python tools/scan_duplicates.py --version 1.2.0 --check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            integration/harness/build.gradle
            integration/harness/gradle.properties
            integration/harness/settings.gradle
            integration/harness/gradle/wrapper/gradle-wrapper.properties
      - name: Build integration harness
        working-directory: integration/harness
        run: ./gradlew --no-daemon clean check build
